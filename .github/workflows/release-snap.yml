name: release-snap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'release version, like v1.2.0-beta.1'
        required: true
      isStable:
        type: boolean
        description: 'check for stable release'
        default: false

jobs:
  release-snap:
    strategy:
      matrix:
        arch:
        - 'amd64'
        - 'arm64'
        - 's390x'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: extract version
        id: version
        run: |
          if [[ "${{ github.event.inputs.isStable }}" == "true" ]]; then
            echo "release=stable" >> $GITHUB_OUTPUT
          else
            echo "release=candidate" >> $GITHUB_OUTPUT
          fi
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
      - name: make snapcraft
        run: |
          sed -i 's/{VERSION}/${{ steps.version.outputs.version }}/g' snapcraft.yaml
          sed -i 's/{ARCH}/${{ matrix.arch }}/g' snapcraft.yaml
          cat snapcraft.yaml
      - uses: canonical/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build

      - name: install snapcraft
        run: |
          if [ ! -x /snap/bin/snapcraft ]; then
            sudo snap install snapcraft --classic
          fi

      - name: publish
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          /snap/bin/snapcraft upload "${{ steps.build.outputs.snap }}" --release "${{ steps.version.outputs.release }}"

