coverage:
  status:
    project:
      default:
        # Temporarily lowered: the Docker-based e2e run contributed ~27 points of
        # coverage, and the KinD job does not collect any yet.
        # Restore to 75% with #2213.
        target: 55%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        if_ci_failed: error

ignore:
  - "test/**"
  - "docs/**"
  - "internal/testutils/**"